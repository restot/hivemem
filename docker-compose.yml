services:
  db:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: ${DB_USER:-hivemem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hivemem_dev}
      POSTGRES_DB: ${DB_NAME:-hivemem_development}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hivemem}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    command: bundle exec puma -C config/puma.rb
    ports:
      - "${PORT:-3055}:3055"
    volumes:
      - ./certs:/rails/certs:ro
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hivemem}
      DB_PASSWORD: ${DB_PASSWORD:-hivemem_dev}
      DB_NAME: ${DB_NAME:-hivemem_development}
      RAILS_ENV: ${RAILS_ENV:-development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev_secret_key_base_change_in_production}
      HIVEMEM_AUTH_TOKEN: ${HIVEMEM_AUTH_TOKEN:-}
      EMBEDDING_MODEL_ID: embeddinggemma-300m-v1
      SSL_CERT_FILE: /rails/certs/server.pem
      SSL_KEY_FILE: /rails/certs/server-key.pem
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
